name: MLAntiCheat
version: ${project.version}
main: com.wnteam.mlanticheat.MLAntiCheat
api-version: '1.21'
author: gravemaulr
description: Machine learning combat analysis for modern Paper servers
website: https://github.com/gravemaulr/MLAntiCheat
softdepend:
  - packetevents
  - PacketEvents
permissions:
  mlac.view:
    default: op
  mlac.alerts:
    default: op
  mlac.train:
    default: op
  mlac.reload:
    default: op
  mlac.tags:
    default: op
  mlac.dummy:
    default: op
  mlac.report:
    default: op
  mlac.report.notify:
    default: op
  mlac.report.manage:
    default: op
  mlac.report.bypass:
    default: false
  mlac.bypass:
    default: false
