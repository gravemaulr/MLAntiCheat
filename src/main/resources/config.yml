model:
  hidden-units: 14
  # размер скрытого слоя модели больше требует больше данных
  learning-rate: 0.035
  # скорость обучения модели не повышай без причины
  l2: 0.00002
  # защита модели от переобучения
  holdout-ratio: 0.15
  # доля примеров для проверки качества модели
  minimum-rotations: 24
  # минимум поворотов головы перед анализом
  evaluation-interval-ms: 220
  # пауза между анализами одного игрока
  combat-window-ms: 2500
  # сколько времени после удара считается боем
  smoothing: 0.82
  # сглаживание скачков оценки модели
  idle-decay: 0.985
  # скорость снижения оценки вне боя
  target-scanner: true
  # поиск видимых целей для признаков реакции

conditions:
  ping:
    start-ms: 150
    # с какого пинга начинается снижение оценки
    full-ms: 300
    # на каком пинге применяется полное снижение
    max-reduction: 0.15
    # максимальное снижение из за пинга
  tps:
    start: 18.5
    # с какого tps начинается снижение оценки
    full: 15.0
    # на каком tps применяется полное снижение
    max-reduction: 0.20
    # максимальное снижение из за tps
  max-total-reduction: 0.30
  # общий предел снижения оценки из за сервера и сети

training:
  minimum-cheat-samples: 400
  # минимум примеров чита для готовности модели
  minimum-legit-samples: 400
  # минимум обычных примеров для готовности модели
  replay-batch: 24
  # размер пакета повторного обучения
  replay-interval: 40
  # как часто модель повторяет старые примеры

auto-training:
  enabled: false
  # включает отложенное обучение по подтвержденным данным
  samples-per-player: 160
  # ограничивает число сохраненных примеров одного игрока
  minimum-samples: 48
  # задает минимум примеров перед обработкой игрока
  quarantine-days: 7
  # хранит неподтвержденные данные до автоматической обработки
  retention-days: 30
  # удаляет старые данные после указанного срока
  clean-max-heuristic: 0.20
  # предел оценки для автоматической чистой выборки
  clean-max-violations: 0
  # предел срабатываний для автоматической чистой выборки
  minimum-class-size: 64
  # требует достаточное число примеров каждого класса
  max-samples-per-class: 1200
  # ограничивает размер одного цикла обучения
  epochs: 2
  # задает число проходов по сбалансированной выборке
  confirmed-weight: 1.8
  # усиливает примеры подтвержденные администрацией
  ban-reason-weight: 0.7
  # снижает вес примеров найденных по причине блокировки
  combat-only-positives: true
  # использует только боевые примеры для класса читов

alerts:
  prefix: '&c[MLAC]&r'
  # префикс сообщений плагина
  shadow-mode: true
  # безопасный режим не выполняет команды и не отменяет удары
  webhook-url: ''
  # адрес вебхука оставь пустым если он не нужен

actions:
  watch:
    enabled: true
    # включает тихую запись подозрения
    threshold: 0.65
    # значение ml после которого работает правило
    confirmations: 3
    # сколько анализов подряд нужно подтвердить
    cooldown-ms: 15000
    # пауза между выполнениями правила
    staff-alert: false
    # отправлять ли сообщение администрации
    console: false
    # писать ли сообщение в консоль
    evidence: false
    # сохранять ли файл доказательств
    cancel-hit: false
    # отменять ли удары игрока
    commands: []
    # команды консоли с плейсхолдерами
  alert:
    enabled: true
    # включает предупреждение администрации
    threshold: 0.82
    # значение ml после которого работает правило
    confirmations: 4
    # сколько анализов подряд нужно подтвердить
    cooldown-ms: 5000
    # пауза между предупреждениями
    staff-alert: true
    # отправляет сообщение игрокам с правом mlac alerts
    console: true
    # пишет срабатывание в консоль
    evidence: false
    # на этом уровне файл еще не сохраняется
    cancel-hit: false
    # на этом уровне удар не отменяется
    commands: []
    # здесь можно добавить свои команды
  evidence:
    enabled: true
    # включает сохранение доказательств
    threshold: 0.90
    # значение ml для сохранения доказательств
    confirmations: 6
    # сколько анализов подряд нужно подтвердить
    cooldown-ms: 30000
    # пауза между файлами доказательств
    staff-alert: false
    # отдельное сообщение не нужно так как alert уже работает
    console: false
    # отдельная запись в консоль не нужна
    evidence: true
    # сохраняет повороты удары и оценки в файл
    cancel-hit: false
    # пока не отменяет удар
    commands: []
    # команды этого уровня
  block:
    enabled: true
    # включает защиту от самых явных срабатываний
    threshold: 0.96
    # значение ml для отмены ударов
    confirmations: 8
    # сколько анализов подряд нужно подтвердить
    cooldown-ms: 1000
    # пауза между действиями правила
    staff-alert: false
    # отдельное сообщение не нужно
    console: false
    # отдельная запись в консоль не нужна
    evidence: true
    # сохраняет доказательства высокого риска
    cancel-hit: true
    # отменяет удары когда shadow mode выключен
    commands: []
    # можно добавить kick или ban когда модель проверена

display:
  enabled: true
  # показывает оценку над игроками для администрации
  update-ticks: 4
  # частота обновления текста в тиках
  height: 0.2
  # высота текста над головой
  scale: 0.55
  # размер текста над игроком

storage:
  autosave-minutes: 5
  # как часто сохранять модель и статистику игроков
