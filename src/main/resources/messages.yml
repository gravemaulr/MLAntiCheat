command:
  players-only: '%prefix% <red>This command is only available in game</red>'
  no-permission: '%prefix% <red>You do not have permission to do that</red>'
  alerts-enabled: '%prefix% <green>Alerts are now visible</green>'
  alerts-disabled: '%prefix% <gray>Alerts are now hidden</gray>'
  tags-enabled: '%prefix% <green>Player tags are now visible</green>'
  tags-disabled: '%prefix% <gray>Player tags are now hidden</gray>'
  dummy-spawned: '%prefix% <green>Physical dummy spawned</green>'
  dummy-removed: '%prefix% <gray>Physical dummy removed</gray>'
  reloaded: '%prefix% <green>MLAntiCheat configuration reloaded</green>'
  inspect-usage: '%prefix% <gray>Usage: <white>/mlac inspect <player></white></gray>'
  stats-usage: '%prefix% <gray>Usage: <white>/mlac stats <player></white></gray>'
  train-usage: '%prefix% <gray>Usage: <white>/mlac train <legit|cheat|stop> <player></white></gray>'
  unknown-player: '%prefix% <red>Player not found</red>'
  no-statistics: '%prefix% <gray>No statistics are available for this player</gray>'
  player-online-required: '%prefix% <red>This player must be online</red>'
  invalid-label: '%prefix% <red>Choose legit cheat or stop</red>'
  training-updated: '%prefix% <green>Training label updated for %player%</green>'
  help: '%prefix% <gray>/mlac <white>gui</white> | inspect | stats | alerts | tags | dummy | train | model | reload</gray>'
  model: '%prefix% <dark_aqua>model</dark_aqua> <gray>ready <white>%ready%</white>  samples <white>%samples%</white>  precision <white>%precision%</white>  recall <white>%recall%</white>  fpr <white>%fpr%</white></gray>'
  stats-title: '%prefix% <dark_aqua>%player%</dark_aqua>'
  stats-scores: '%prefix% <gray>precision <white>%prec%</white>  dynamics <white>%dyn%</white>  pattern <white>%pat%</white>  tracking <white>%trk%</white>  ml <white>%ml%</white></gray>'
  stats-summary: '%prefix% <gray>analyses <white>%analyses%</white>  alerts <white>%alerts%</white>  average <white>%average%</white>  maximum <white>%maximum%</white></gray>'
alert:
  staff: '%prefix% <white>%player%</white> <dark_gray>·</dark_gray> <gray>ml <white>%score%</white>  raw <white>%raw_score%</white>  %ping% ms  %tps% tps  %rule% %confirmations%/%required%</gray>'
  hover: '<gray>Open the player card</gray>'
  console: '%player% | ml %score% raw %raw_score% | %ping% ms %tps% tps | %rule% %confirmations%/%required%'
tag:
  separator: '<dark_gray> · </dark_gray>'
  label: '<gray>%name%</gray> '
  value: '<white>%value%</white>'
time:
  never: never
  days: '%value%d ago'
  hours: '%value%h ago'
  minutes: '%value%m ago'
  seconds: '%value%s ago'
status:
  online: online
  offline: offline
  all-players: all players
  search: 'search: %query%'
